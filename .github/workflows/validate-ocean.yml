name: Helm Chart Validation

on:
  pull_request:
    paths:
      - charts/port-ocean/**

jobs:
  validate:
    defaults:
      run:
        working-directory: charts/port-ocean/
    runs-on: ubuntu-latest
    name: Validate Helm Chart

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: v3.21.0

    - name: Create k8s Kind Cluster
      uses: helm/kind-action@v1.5.0

    - name: Install Helm unit test plugin
      run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.0.3

    - name: Lint Helm Chart
      run: helm lint .

    - name: Build dependencies of Helm Chart
      run: |
        helm repo add bitnami https://charts.bitnami.com/bitnami
        helm repo update
        helm dependency update

    - name: Run Helm unit tests
      run: helm unittest . --strict

    - name: Validate test manifests against Kubernetes schemas
      run: |
        for values_file in tests/values/*.yaml; do
          helm template "$(basename "$values_file" .yaml)" . --values "$values_file" |
            kubectl apply --dry-run=client -f -
        done
