{{- $eventListener := .Values.integration.eventListener }}
{{- if eq .Values.workload.kind "CronJob" }}
  {{- $eventListener = dict "type" "ONCE" }}
{{- end}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "port-ocean.configMapName" . }}
data:
  OCEAN__PORT__BASE_URL: {{ tpl .Values.port.baseUrl . | quote }}
  OCEAN__INITIALIZE_PORT_RESOURCES: "{{ .Values.initializePortResources | default false }}"
  {{- if .Values.createPortResourcesOrigin }}
  OCEAN__CREATE_PORT_RESOURCES_ORIGIN: "{{ .Values.createPortResourcesOrigin }}"
  {{- end }}
  OCEAN__ALLOW_ENVIRONMENT_VARIABLES_JQ_ACCESS: "{{ if hasKey .Values "allowEnvironmentVariablesJqAccess" }}{{ .Values.allowEnvironmentVariablesJqAccess }}{{ else }}true{{ end }}"
  {{- if  and .Values.scheduledResyncInterval (not (eq .Values.workload.kind "CronJob")) }}
  OCEAN__SCHEDULED_RESYNC_INTERVAL: "{{ .Values.scheduledResyncInterval }}"
  {{- end }}
  {{- if .Values.clientTimeout }}
  OCEAN__CLIENT_TIMEOUT: "{{ .Values.clientTimeout }}"
  {{- end }}
  OCEAN__SEND_RAW_DATA_EXAMPLES: "{{ .Values.sendRawDataExamples | default true }}"
  OCEAN__EVENT_LISTENER: {{ $eventListener | toJson | quote }}
  {{- if .Values.integration.identifier }}
  OCEAN__INTEGRATION__IDENTIFIER: "{{ .Values.integration.identifier }}"
  {{- end }}
  {{- if .Values.integration.oauth.enabled }}
  OCEAN__OAUTH_ACCESS_TOKEN_FILE_PATH: "{{ .Values.integration.oauth.access_token_file_path }}"
  {{- end }}
  {{- if .Values.integration.config }}
  {{- range $key, $value := .Values.integration.config }}
  {{- if or (kindIs "map" $value) (kindIs "slice" $value) }}
  OCEAN__INTEGRATION__CONFIG__{{ $key | snakecase | upper }}: {{ $value | toJson | quote }}
  {{- else }}
  OCEAN__INTEGRATION__CONFIG__{{ $key | snakecase | upper }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if .Values.integration.extraConfig }}
  {{- range $key, $value := .Values.integration.extraConfig }}
  {{ $key | snakecase | upper }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
  {{- if (.Values.identityPropagation).enabled }}
  OCEAN__IDENTITY_PROPAGATION__ENABLED: "true"
  OCEAN__IDENTITY_PROPAGATION__VAULT__TYPE: {{ .Values.identityPropagation.vault.type | default "aws_secrets_manager" | quote }}
  OCEAN__IDENTITY_PROPAGATION__VAULT__SECRET_PREFIX: {{ .Values.identityPropagation.vault.secretPrefix | default "port/tokens" | quote }}
  {{- with .Values.identityPropagation.vault.awsRegion }}
  OCEAN__IDENTITY_PROPAGATION__VAULT__AWS_REGION: {{ . | quote }}
  {{- end }}
  {{- with .Values.identityPropagation.vault.endpointUrl }}
  OCEAN__IDENTITY_PROPAGATION__VAULT__ENDPOINT_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.identityPropagation.oauth.github }}
  {{- include "port-ocean.identityPropagation.providerConfig" (list "GITHUB" .) | trim | nindent 2 }}
  {{- end }}
  {{- with .Values.identityPropagation.oauth.gitlab }}
  {{- include "port-ocean.identityPropagation.providerConfig" (list "GITLAB" .) | trim | nindent 2 }}
  {{- with .host }}
  OCEAN__IDENTITY_PROPAGATION__OAUTH__GITLAB__HOST: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.identityPropagation.oauth.azureDevops }}
  {{- include "port-ocean.identityPropagation.providerConfig" (list "AZURE_DEVOPS" .) | trim | nindent 2 }}
  {{- with .tenantId }}
  OCEAN__IDENTITY_PROPAGATION__OAUTH__AZURE_DEVOPS__TENANT_ID: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  OCEAN__LAKEHOUSE_ENABLED: "{{ .Values.lakehouseEnabled | default true }}"
  OCEAN__PROCESSING_MODE: {{ .Values.processingMode | default "dsp" | quote }}
  OCEAN__STREAMING__ENABLED: "{{ .Values.streamingEnabled | default false }}"
  OCEAN__ACTIONS_PROCESSOR__ENABLED: "{{ .Values.actionsProcessor.enabled | default false }}"
  {{- if .Values.actionsProcessor.extraConfig }}
  {{- range $key, $value := .Values.actionsProcessor.extraConfig }}
  OCEAN__ACTIONS_PROCESSOR__{{ $key | snakecase | upper }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
