{{- if eq .Values.workload.kind "CronJob" }}
{{- $maxRunTimeSeconds := "" }}
{{- if (.Values.workload.cron).resyncTimeoutMinutes }}
{{- $minute := 60 }}
{{- $maxRunTimeSeconds = (mul (.Values.workload.cron).resyncTimeoutMinutes $minute )}}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "port-ocean.cronJobName" . }}
  labels:
    {{- include "port-ocean.labels" . | nindent 4 }}
spec:
  failedJobsHistoryLimit: {{ .Values.workload.cron.failedJobsHistoryLimit }}
  successfulJobsHistoryLimit: {{ .Values.workload.cron.successfulJobsHistoryLimit }}
  {{- $scheduleValue := (.Values.scheduledResyncInterval | default "0 */1 * * *") | toString }}
  schedule: {{ if regexMatch "^[\"'].*[\"']$" $scheduleValue }}{{ $scheduleValue }}{{ else }}{{ $scheduleValue | squote }}{{ end }}
  suspend: {{ .Values.workload.cron.suspend }}
  concurrencyPolicy: {{ .Values.scheduleConcurrencyPolicy | default "Replace" }}
  jobTemplate:
    metadata:
      generateName: {{ include "port-ocean.resourceName" (list . "-" 58) }}
      namespace: {{ .Release.Namespace }}
      labels:
        app: {{ include "port-ocean.cronJobName" . }}
        integrationUniqueCronKey: {{ .Release.Name }}
        {{- include "port-ocean.selectorLabels" . | indent 8 }}
    spec:
      backoffLimit: 0
      {{- if $maxRunTimeSeconds }}
      activeDeadlineSeconds: {{ $maxRunTimeSeconds }}
      {{- end }}
      template:
        metadata:
          {{- $podAnnotations := .Values.podAnnotations | default dict }}
          {{- $cronAnnotations := (.Values.workload.cron.annotations | default dict) }}
          {{- $annotations := merge (dict) $podAnnotations $cronAnnotations }}
          {{- with $annotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          labels:
            app: {{ include "port-ocean.cronJobName" . }}
            {{- include "port-ocean.labels" . | nindent 12 }}
            {{- if .Values.integration.oauth.enabled }}
            ocean.port.io/oauth-refreshable: "true"
            {{- end }}
        spec:
          {{- if or .Values.podServiceAccount.name .Values.podServiceAccount.create }}
          serviceAccountName: {{ include "port-ocean.serviceAccountName" . }}
          {{- end }}
          restartPolicy: Never
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- if .Values.podSecurityContext }}
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
            {{- end }}
          initContainers:
            {{- if .Values.extraInitContainers }}
            {{- tpl (toYaml .Values.extraInitContainers) . | nindent 12 }}
            {{- end }}
            - name: resolve-ocean-image-digest
              image: {{ include "port-ocean.image" . }}
              {{- include "port-ocean.initContainer.containerDefaults" . | nindent 14 }}
              command:
                - sh
                - -c
                - exit 0
            - name: terminate-old-resync-jobs
              image: {{ .Values.workload.cron.kubectlImage }}
              {{- include "port-ocean.initContainer.containerDefaults" . | nindent 14 }}
              env:
                - name: JOB_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.labels['job-name']
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: OCEAN_CONTAINER_NAME
                  value: {{ include "port-ocean.containerName" . | quote }}
                - name: TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "port-ocean.cron.job-query-rbac-name" (list . "-sa-token") }}
                      key: token
              command:
                - /bin/bash
                - -c
                - |
                  #!/bin/bash
                  echo "Starting init container"
                  LABEL_SELECTOR="integrationUniqueCronKey={{ .Release.Name }}"
                  NAMESPACE="{{ .Release.Namespace }}"
                  CURRENT_JOB_NAME="${JOB_NAME}"
                  DEADLINE=0  # 30 seconds deadline for the jobs to terminate

                  echo "kubectl get jobs -l ${LABEL_SELECTOR} -o=json | jq -r \".items[] | select(.status.active > 0) | select(.metadata.name != \"$CURRENT_JOB_NAME\") | .metadata.name\""
                  JOBS=$(kubectl get jobs -l ${LABEL_SELECTOR} -o=json --token=$TOKEN | jq -r ".items[] | select(.status.active > 0) | select(.metadata.name != \"$CURRENT_JOB_NAME\") | .metadata.name")
                  if [ -n "$JOBS" ]; then
                    echo "Found jobs: $JOBS"
                    for JOB in $JOBS; do
                      echo "Setting deadline for job: $JOB"
                      kubectl patch job $JOB -n ${NAMESPACE} -p "{\"spec\":{\"activeDeadlineSeconds\":$DEADLINE}, \"metadata\":{\"labels\":{\"canceled\": \"$CURRENT_JOB_NAME\"}}}" --token=$TOKEN
                    done
                    for JOB in $JOBS; do
                      echo "Waiting for job $JOB to terminate"
                      kubectl wait --for=delete pod --selector=job-name=$JOB --timeout=60s -n ${NAMESPACE} --token=$TOKEN || (echo "Job $JOB did not terminate in time. Cannot start new job: $CURRENT_JOB_NAME" && exit 1)
                      echo "Done"
                    done
                  else
                    echo "No running resync jobs found. Starting new job: $CURRENT_JOB_NAME"
                  fi

                  # Restart worker deployments only when their running image digest differs from the
                  # integration image digest for this resync (resolved by pulling the integration image).
                  extract_digest() {
                    local image_id="$1"
                    case "$image_id" in
                      *@sha256:*)
                        echo "${image_id##*@sha256:}"
                        ;;
                      *sha256:*)
                        echo "${image_id##*sha256:}"
                        ;;
                      *)
                        echo ""
                        ;;
                    esac
                  }

                  resolve_desired_digest() {
                    local image_id=""
                    local attempt
                    for attempt in $(seq 1 15); do
                      image_id=$(kubectl get pod "$POD_NAME" -n "${NAMESPACE}" --token="$TOKEN" -o=json | jq -r '.status.initContainerStatuses[]? | select(.name=="resolve-ocean-image-digest") | .imageID // empty' | head -n1)
                      if [ -n "$image_id" ] && [ "$image_id" != "null" ]; then
                        break
                      fi
                      sleep 1
                    done
                    extract_digest "$image_id"
                  }

                  rollout_if_image_digest_differs() {
                    local DEPLOYMENT_NAME=$1

                    echo "Running: kubectl get deployment ${DEPLOYMENT_NAME} -o=json | jq -r \".metadata.name\""
                    DEPLOYMENT=$(kubectl get deployment ${DEPLOYMENT_NAME} --token=$TOKEN -o=json | jq -r ".metadata.name")

                    if [ -z "$DEPLOYMENT" ]; then
                      echo "Deployment $DEPLOYMENT_NAME does not exist. Skipping rollout restart."
                      return
                    fi

                    echo "Found deployment: $DEPLOYMENT"

                    if [ -z "$DESIRED_DIGEST" ]; then
                      echo "Could not resolve desired integration image digest; rolling out $DEPLOYMENT"
                      kubectl rollout restart deployment "$DEPLOYMENT" -n "${NAMESPACE}" --token=$TOKEN
                      return
                    fi

                    local pod_image_ids
                    pod_image_ids=$(kubectl get pods -n "${NAMESPACE}" -l "app=${DEPLOYMENT_NAME}" --field-selector=status.phase=Running --token="$TOKEN" -o=json | jq -r --arg c "$OCEAN_CONTAINER_NAME" '[.items[].status.containerStatuses[]? | select(.name==$c) | .imageID // empty] | unique | .[]')

                    if [ -z "$pod_image_ids" ]; then
                      echo "No running pods for ${DEPLOYMENT_NAME}; skipping rollout restart."
                      return
                    fi

                    local image_id pod_digest
                    while IFS= read -r image_id; do
                      [ -z "$image_id" ] && continue
                      pod_digest=$(extract_digest "$image_id")
                      if [ -z "$pod_digest" ] || [ "$pod_digest" != "$DESIRED_DIGEST" ]; then
                        echo "Image digest mismatch for ${DEPLOYMENT_NAME} (pod=${pod_digest:-unknown} desired=${DESIRED_DIGEST}); rolling out"
                        kubectl rollout restart deployment "$DEPLOYMENT" -n "${NAMESPACE}" --token=$TOKEN
                        return
                      fi
                    done <<< "$pod_image_ids"

                    echo "Running pods already match desired digest for ${DEPLOYMENT_NAME}; skipping rollout restart."
                  }

                  DESIRED_DIGEST=$(resolve_desired_digest)
                  echo "Desired integration image digest: ${DESIRED_DIGEST:-unresolved}"

                  rollout_if_image_digest_differs {{ include "port-ocean.liveEvents.deploymentName" . }}
                  rollout_if_image_digest_differs {{ include "port-ocean.actionsProcessor.deploymentName" . }}

                  echo "Exiting init container"
          containers:
          - name: {{ include "port-ocean.containerName" . }}
            imagePullPolicy: {{ .Values.imagePullPolicy }}
            image: {{ include "port-ocean.image" . }}
            {{- if .Values.service.enabled }}
            securityContext:
              {{- if .Values.containerSecurityContext }}
              {{- toYaml .Values.containerSecurityContext | nindent 14 }}
              {{- end }}
            resources:
              {{- if .Values.resources }}
              {{- toYaml .Values.resources | nindent 14 }}
              {{- end }}
            ports:
            - containerPort: {{.Values.service.port}}
              protocol: TCP
            {{- end }}
            env:
            {{- if .Values.selfSignedCertificate.enabled }}
              - name: SSL_CERT_FILE
                value: /etc/ssl/certs/ca-certificates.crt
              - name: REQUESTS_CA_BUNDLE
                value: /etc/ssl/certs/ca-certificates.crt
            {{- end }}
            {{- if .Values.extraEnv }}
              {{- tpl (toYaml .Values.extraEnv) . | nindent 14 }}
            {{- end }}
            envFrom:
              - configMapRef:
                  name: {{ include "port-ocean.configMapName" . }}
              {{- include "port-ocean.additionalSecrets" . | nindent 14 }}
              {{- include "port-ocean.centralizedRateLimiterSecret" . | nindent 14 }}
            volumeMounts:
              - name: ocean-tmp
                mountPath: /tmp/ocean
            {{- if .Values.extraVolumeMounts }}
              {{- tpl (toYaml .Values.extraVolumeMounts) . | nindent 14 }}
            {{- end }}
            {{- if .Values.selfSignedCertificate.enabled }}
              - name: certificates
                mountPath: /usr/local/share/ca-certificates/cert.crt
                subPath: cert.crt
                readOnly: true
            {{- end }}
          {{- if .Values.workload.cron.extraContainers }}
          {{- tpl (toYaml .Values.workload.cron.extraContainers) . | nindent 10 }}
          {{- end }}
          volumes:
            - name: ocean-tmp
              emptyDir: { }
            {{- if .Values.extraVolumes }}
            {{- tpl (toYaml .Values.extraVolumes) . | nindent 12 }}
            {{- end }}
            {{- if and .Values.selfSignedCertificate.enabled .Values.selfSignedCertificate.secret.useExistingSecret }}
            - name: certificates
              projected:
                sources:
                  - secret:
                      name: {{ .Values.selfSignedCertificate.secret.name }}
                      items:
                        - key: {{ .Values.selfSignedCertificate.secret.key }}
                          path: cert.crt
            {{- else if .Values.selfSignedCertificate.enabled }}
            - name: certificates
              projected:
                sources:
                  - secret:
                      name: {{ include "port-ocean.selfSignedCertName" . }}
                      items:
                        - key: crt
                          path: cert.crt
            {{- end }}
          {{- with .Values.hostAliases }}
          hostAliases:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
