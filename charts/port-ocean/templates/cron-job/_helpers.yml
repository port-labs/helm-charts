{{/*
Generate names for CronJob init-container RBAC resources.
Auto-generates unique names from integration.type and integration.identifier.
Supports optional custom naming via workload.cron.initContainer.serviceAccount.name
*/}}
{{- define "port-ocean.cron.job-query-rbac-name" -}}
{{- $suffix := printf "-job-query%s" .suffix -}}
{{- if and (.root.Values.workload.cron.initContainer) (.root.Values.workload.cron.initContainer.serviceAccount) (.root.Values.workload.cron.initContainer.serviceAccount.name) -}}
{{- printf "%s%s" .root.Values.workload.cron.initContainer.serviceAccount.name $suffix | trunc 63 | trimSuffix "-" -}}
{{- else -}}
{{- include "port-ocean.resourceName" (dict "root" .root "suffix" $suffix "maxLength" 63) -}}
{{- end -}}
{{- end }}
