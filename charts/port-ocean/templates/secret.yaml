{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "port-ocean.secretName" . }}
  labels:
    {{- include "port-ocean.labels" $ | nindent 4 }}
type: opaque
data:
  OCEAN__PORT__CLIENT_ID: {{ required "port.clientId is required" .Values.port.clientId | b64enc | quote }}
  OCEAN__PORT__CLIENT_SECRET: {{ required "port.clientSecret is required" .Values.port.clientSecret | b64enc | quote }}
  {{- if .Values.integration.secrets }}
  {{- range $key, $value := .Values.integration.secrets }}
  OCEAN__INTEGRATION__CONFIG__{{ $key | snakecase | upper }}:
    {{ if kindIs "map" $value }}{{ $value | toJson | b64enc | quote }}{{ else }}{{ $value | toString | b64enc | quote }}{{ end }}
  {{- end }}
  {{- end }}
  {{- if (.Values.identityPropagation).enabled }}
  {{- with .Values.identityPropagation.vault.awsAccessKeyId }}
  OCEAN__IDENTITY_PROPAGATION__VAULT__AWS_ACCESS_KEY_ID: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.identityPropagation.vault.awsSecretAccessKey }}
  OCEAN__IDENTITY_PROPAGATION__VAULT__AWS_SECRET_ACCESS_KEY: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.identityPropagation.oauth.stateSigningSecret }}
  OCEAN__IDENTITY_PROPAGATION__OAUTH__STATE_SIGNING_SECRET: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.identityPropagation.oauth.github }}
  {{- include "port-ocean.identityPropagation.providerSecret" (list "GITHUB" .) | trim | nindent 2 }}
  {{- end }}
  {{- with .Values.identityPropagation.oauth.gitlab }}
  {{- include "port-ocean.identityPropagation.providerSecret" (list "GITLAB" .) | trim | nindent 2 }}
  {{- end }}
  {{- with .Values.identityPropagation.oauth.azureDevops }}
  {{- include "port-ocean.identityPropagation.providerSecret" (list "AZURE_DEVOPS" .) | trim | nindent 2 }}
  {{- end }}
  {{- end }}
{{- end }}
