suite: Resync CronJob
templates:
  - templates/cron-job/cron.yaml
tests:
  - it: does not render for single deployment
    values:
      - values/single.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: does not render for split workers
    values:
      - values/split.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders for hybrid architecture
    values:
      - values/hybrid-cron.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: ocean-github-test-id-cron-job
      - equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].name
          value: resolve-ocean-image-digest
      - equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].image
          value: ghcr.io/port-labs/port-ocean-github:0.1.0
      - equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[1].name
          value: terminate-old-resync-jobs
      - equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[1].env[1].name
          value: POD_NAME
      - equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[1].env[2].name
          value: OCEAN_CONTAINER_NAME
      - matchRegex:
          path: spec.jobTemplate.spec.template.spec.initContainers[1].command[2]
          pattern: rollout_if_image_digest_differs
      - matchRegex:
          path: spec.jobTemplate.spec.template.spec.initContainers[1].command[2]
          pattern: resolve-ocean-image-digest

  - it: mounts centralized rate limiter redis credentials
    values:
      - values/hybrid-cron.yaml
    set:
      centralizedRateLimiter.redis.credentialsSecretName: rate-limiter-credentials
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: rate-limiter-credentials
              optional: true
