suite: Main deployment
templates:
  - templates/deployment.yaml
tests:
  - it: renders for the single architecture
    values:
      - values/single.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: ocean-github-test-id-deployment
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 30
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.initialDelaySeconds
          value: 5
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 5
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.successThreshold
          value: 1
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 5

  - it: renders deployment annotations
    values:
      - values/deployment-annotations.yaml
    asserts:
      - equal:
          path: metadata.annotations["example.com/monitoring"]
          value: enabled

  - it: renders for split workers
    values:
      - values/split.yaml
    asserts:
      - hasDocuments:
          count: 1

  - it: does not render for hybrid architecture
    values:
      - values/hybrid-cron.yaml
    asserts:
      - hasDocuments:
          count: 0
