suite: Live-events deployment
templates:
  - templates/deployment-live-events.yaml
tests:
  - it: does not render for the single architecture
    values:
      - values/single.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders for split workers
    values:
      - values/split.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: ocean-github-test-id-le-deployment
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 30
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.initialDelaySeconds
          value: 5
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 5
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.successThreshold
          value: 1
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 5

  - it: stamps workload-type=live-events on the pod template
    values:
      - values/split.yaml
    asserts:
      - equal:
          path: spec.template.metadata.labels["ocean.port.io/workload-type"]
          value: live-events

  - it: workload-type is absent from selector matchLabels
    values:
      - values/split.yaml
    asserts:
      - notExists:
          path: spec.selector.matchLabels["ocean.port.io/workload-type"]

  - it: podLabels collision - chart workload-type wins over podLabels entry
    values:
      - values/split.yaml
    set:
      podLabels:
        ocean.port.io/workload-type: bogus
    asserts:
      - equal:
          path: spec.template.metadata.labels["ocean.port.io/workload-type"]
          value: live-events

  - it: renders podLabels on the pod template
    values:
      - values/split.yaml
    set:
      podLabels:
        ocean.port.io/org-tier: ENTERPRISE
    asserts:
      - equal:
          path: spec.template.metadata.labels["ocean.port.io/org-tier"]
          value: ENTERPRISE

  - it: renders for hybrid architecture
    values:
      - values/hybrid-cron.yaml
    asserts:
      - hasDocuments:
          count: 1

  - it: mounts centralized rate limiter redis credentials
    values:
      - values/split.yaml
    set:
      centralizedRateLimiter.redis.credentialsSecretName: rate-limiter-credentials
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: rate-limiter-credentials
              optional: true
