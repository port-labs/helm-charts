suite: Long resource names
tests:
  - it: names core resources
    templates:
      - templates/configmap.yaml
      - templates/deployment.yaml
      - templates/service.yaml
      - templates/secret.yaml
    values:
      - values/long-a.yaml
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^[a-z0-9-]{1,47}-[a-f0-9]{8}-config$
        template: templates/configmap.yaml
      - matchRegex:
          path: metadata.name
          pattern: ^[a-z0-9-]{1,43}-[a-f0-9]{8}-deployment$
        template: templates/deployment.yaml
      - matchRegex:
          path: metadata.name
          pattern: ^[a-z0-9-]{1,46}-[a-f0-9]{8}-service$
        template: templates/service.yaml
      - matchRegex:
          path: metadata.name
          pattern: ^[a-z0-9-]{1,47}-[a-f0-9]{8}-secret$
        template: templates/secret.yaml

  - it: normalizes a trailing dash in a metadata name override
    templates:
      - templates/deployment.yaml
    values:
      - values/long-a.yaml
    set:
      metadataNamePrefixOverride: custom-prefix-
    asserts:
      - equal:
          path: metadata.name
          value: custom-prefix-deployment

  - it: names opt-in core resources
    templates:
      - templates/service-account.yaml
      - templates/ingress.yaml
      - templates/certificate_secret.yaml
    values:
      - values/long-a.yaml
    set:
      podServiceAccount.create: true
      ingress.enabled: true
      selfSignedCertificate.enabled: true
      selfSignedCertificate.certificate: test
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^[a-z0-9-]{1,51}-[a-f0-9]{8}-sa$
        template: templates/service-account.yaml
      - matchRegex:
          path: metadata.name
          pattern: ^[a-z0-9-]{1,46}-[a-f0-9]{8}-ingress$
        template: templates/ingress.yaml
      - matchRegex:
          path: metadata.name
          pattern: ^[a-z0-9-]{1,49}-[a-f0-9]{8}-cert$
        template: templates/certificate_secret.yaml

  - it: names live-events resources
    templates:
      - templates/configmap-live-events.yaml
      - templates/deployment-live-events.yaml
      - templates/service-live-events.yaml
      - templates/ingress-live-events.yaml
    values:
      - values/long-a.yaml
    set:
      liveEvents.worker.enabled: true
      liveEvents.ingress.enabled: true
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^[a-z0-9-]{1,44}-[a-f0-9]{8}-le-config$
        template: templates/configmap-live-events.yaml
      - matchRegex:
          path: metadata.name
          pattern: ^[a-z0-9-]{1,40}-[a-f0-9]{8}-le-deployment$
        template: templates/deployment-live-events.yaml
      - matchRegex:
          path: metadata.name
          pattern: ^[a-z0-9-]{1,43}-[a-f0-9]{8}-le-service$
        template: templates/service-live-events.yaml
      - matchRegex:
          path: metadata.name
          pattern: ^[a-z0-9-]{1,43}-[a-f0-9]{8}-le-ingress$
        template: templates/ingress-live-events.yaml

  - it: names actions-processor resources
    templates:
      - templates/actions-processor/configmap.yaml
      - templates/actions-processor/deployment.yaml
      - templates/actions-processor/service.yaml
    values:
      - values/long-a.yaml
    set:
      actionsProcessor.enabled: true
      actionsProcessor.worker.enabled: true
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^[a-z0-9-]{1,44}-[a-f0-9]{8}-ap-config$
        template: templates/actions-processor/configmap.yaml
      - matchRegex:
          path: metadata.name
          pattern: ^[a-z0-9-]{1,40}-[a-f0-9]{8}-ap-deployment$
        template: templates/actions-processor/deployment.yaml
      - matchRegex:
          path: metadata.name
          pattern: ^[a-z0-9-]{1,43}-[a-f0-9]{8}-ap-service$
        template: templates/actions-processor/service.yaml

  - it: names resync CronJob resources
    templates:
      - templates/cron-job/cron.yaml
      - templates/cron-job/cron-jobs-init-container-sa.yml
    values:
      - values/long-hybrid-cron.yaml
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^[a-z0-9-]{1,34}-[a-f0-9]{8}-cron-job$
        template: templates/cron-job/cron.yaml
      - matchRegex:
          path: spec.jobTemplate.metadata.generateName
          pattern: ^[a-z0-9-]{1,48}-[a-f0-9]{8}-$
        template: templates/cron-job/cron.yaml
      - matchRegex:
          path: metadata.name
          pattern: ^[a-z0-9-]{1,41}-[a-f0-9]{8}-job-query-sa$
        template: templates/cron-job/cron-jobs-init-container-sa.yml
        documentIndex: 0
      - matchRegex:
          path: metadata.name
          pattern: ^[a-z0-9-]{1,39}-[a-f0-9]{8}-job-query-role$
        template: templates/cron-job/cron-jobs-init-container-sa.yml
        documentIndex: 1
      - matchRegex:
          path: metadata.name
          pattern: ^[a-z0-9-]{1,32}-[a-f0-9]{8}-job-query-rolebinding$
        template: templates/cron-job/cron-jobs-init-container-sa.yml
        documentIndex: 2
      - matchRegex:
          path: metadata.name
          pattern: ^[a-z0-9-]{1,35}-[a-f0-9]{8}-job-query-sa-token$
        template: templates/cron-job/cron-jobs-init-container-sa.yml
        documentIndex: 3

  - it: hashes long custom CronJob service account names
    templates:
      - templates/cron-job/cron-jobs-init-container-sa.yml
    values:
      - values/long-hybrid-cron.yaml
    set:
      workload.cron.initContainer.serviceAccount.name: custom-service-account-name-that-is-deliberately-long-and-differs-at-the-end
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^custom-[a-z0-9-]{0,34}-[a-f0-9]{8}-job-query-sa$
        documentIndex: 0

  - it: names incremental sync resources
    templates:
      - templates/configmap-incremental.yaml
      - templates/cron-job/incremental-cron.yaml
    values:
      - values/long-a.yaml
    set:
      incrementalSync.enabled: true
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^[a-z0-9-]{1,42}-[a-f0-9]{8}-incr-config$
        template: templates/configmap-incremental.yaml
      - matchRegex:
          path: metadata.name
          pattern: ^[a-z0-9-]{1,33}-[a-f0-9]{8}-incr-cron$
        template: templates/cron-job/incremental-cron.yaml
      - matchRegex:
          path: spec.jobTemplate.metadata.generateName
          pattern: ^[a-z0-9-]{1,43}-[a-f0-9]{8}-incr-$
        template: templates/cron-job/incremental-cron.yaml

  - it: preserves one deterministic compatibility name
    templates:
      - templates/deployment.yaml
    values:
      - values/long-b.yaml
    asserts:
      - equal:
          path: metadata.name
          value: ocean-github-integration-identifier-that-is-81b6484d-deployment
