suite: Main ConfigMap incremental sync
templates:
  - templates/configmap.yaml
tests:
  - it: does not set incremental sync flag by default
    values:
      - values/single.yaml
    asserts:
      - notExists:
          path: data.OCEAN__INTEGRATION__INCREMENTAL_SYNC_ENABLED

  - it: does not set incremental sync flag when incremental sync is enabled
    values:
      - values/single.yaml
    set:
      incrementalSync.enabled: true
    asserts:
      - notExists:
          path: data.OCEAN__INTEGRATION__INCREMENTAL_SYNC_ENABLED
